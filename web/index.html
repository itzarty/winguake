<!DOCTYPE html>
<html>
    <head>
        <title>WinGauke</title>
        <link rel="stylesheet" type="text/css" href="assets/css/style.css" />
        <link rel="stylesheet" type="text/css" href="assets/css/fontawesome.min.css" />
        <link rel="stylesheet" type="text/css" href="../node_modules/@xterm/xterm/css/xterm.css" />
        <script src="assets/js/au.js"></script>
        <script src="assets/js/sortable.min.js"></script>
        <script src="assets/js/audio.js"></script>
        <script src="assets/js/util.js"></script>

        <script src="assets/js/contextmenu.js" defer></script>
        <script src="assets/js/tooltip.js" defer></script>

        <script src="assets/js/core.js" defer></script>
    </head>
    <body>
        <span class="tooltip"></span>
        <div class="context-menu"></div>
        <div class="container">
            <input type="text" class="searchbox" spellcheck="false" />
            <div class="omnibox-wrapper">
                <input type="text" class="omnibox" spellcheck="false" />
            </div>
            <div class="modal-wrapper">
                <div class="modal">
                    <div class="modal-header">
                        <button class="modal-button modal-back">
                            <i class="fa-solid fa-angle-left"></i>
                        </button>
                        <span class="modal-title"></span>
                        <button class="modal-button modal-action"></button>
                        <button class="modal-button modal-close">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="toolbar">
                <div class="tabs"></div>
                <div class="button" id="btn_instance">
                    <i class="fa-solid fa-plus"></i>
                </div>
                <div class="button" id="btn_preferences">
                    <i class="fa-solid fa-gear"></i>
                </div>
            </div>
            <div class="wrappers"></div>
            <div class="boundary top"></div>
            <div class="boundary bottom"></div>
            <div class="boundary left"></div>
            <div class="boundary right"></div>
        </div>
    </body>
</html>
