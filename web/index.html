<!DOCTYPE html>
<html>
    <head>
        <title>WinGauke</title>
        <link rel="stylesheet" type="text/css" href="assets/css/style.css" />
        <link rel="stylesheet" type="text/css" href="assets/css/fontawesome.min.css" />
        <link rel="stylesheet" type="text/css" href="../node_modules/@xterm/xterm/css/xterm.css" />
        <script src="assets/js/au.js"></script>
        <script src="assets/js/sortable.min.js"></script>
        <script src="assets/js/audio.js"></script>
        <script src="assets/js/util.js"></script>

        <script src="assets/js/contextmenu.js" defer></script>
        <script src="assets/js/tooltip.js" defer></script>

        <script src="assets/js/fuse.js"></script>
        <script src="assets/js/core.js" defer></script>
    </head>
    <body>
        <div class="broadcast-wrapper"></div>
        <span class="tooltip"></span>
        <div class="context-menu"></div>
        <div class="container">
            <div class="modal-wrapper">
                <div class="modal">
                    <div class="modal-header">
                        <button class="modal-button modal-back">
                            <i class="fa-solid fa-angle-left"></i>
                        </button>
                        <span class="modal-title"></span>
                        <button class="modal-button modal-action"></button>
                        <button class="modal-button modal-close">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    <div class="modal-content"></div>
                </div>
            </div>
            <div class="toolbar">
                <div class="inputbar-wrapper">
                    <div class="inputbar-icon">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                    <div class="inputbar-tokens"></div>
                    <input class="inputbar" type="text" />
                    <div class="inputbar-hint"></div>
                    <div class="inputbar-suggestions"></div>
                </div>
                <div class="tab-groups">
                    <div class="controls">
                        <div class="btn" id="btn_preferences">
                            <i class="fa-solid fa-gear"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="wrapper-groups"></div>
            <div class="boundary top"></div>
            <div class="boundary bottom"></div>
            <div class="boundary left"></div>
            <div class="boundary right"></div>
        </div>
    </body>
</html>
